<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#06090d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="C2 HELL">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<title>C2 HELL — Air Defense Command</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header id="top">
    <div class="r1">
      <button id="btn-menu" class="tbtn" data-i18n-aria="a.menu" aria-label="Menú">☰</button>
      <div class="stat"><span class="lbl" data-i18n="hud.level">NIVEL</span><b id="s-level">1</b></div>
      <div class="stat"><span class="lbl" data-i18n="hud.wave">OLEADA</span><b id="s-wave">0/0</b></div>
      <div class="stat"><span class="lbl" data-i18n="hud.next">PRÓX.</span><b id="s-next">—</b></div>
      <div class="stat"><span class="lbl">T+</span><b id="s-time">0:00</b></div>
      <div class="stat"><span class="lbl" data-i18n="hud.credits">CRÉDITOS</span><b id="s-cred" class="amber">0</b></div>
      <button id="btn-snd" class="tbtn" data-i18n-aria="a.sound" aria-label="Sonido">♪</button>
    </div>
    <div class="r2">
      <div class="stat grow"><span class="lbl" data-i18n="hud.integrity">INTEGRIDAD</span>
        <div class="bar"><i id="s-integ"></i></div></div>
      <div id="speeds" class="hidden">
        <button class="tbtn spd" data-s="0" data-i18n-aria="a.pause" aria-label="Pausa">❚❚</button>
        <button class="tbtn spd" data-s="1">1×</button>
        <button class="tbtn spd" data-s="2">2×</button>
        <button class="tbtn spd" data-s="4">4×</button>
      </div>
      <button id="btn-start" data-i18n="btn.start">▶ INICIAR OPERACIÓN</button>
    </div>
  </header>

  <main id="mapwrap">
    <canvas id="c"></canvas>
    <div id="phase" class="prep">PREPARACIÓN</div>
    <div id="log"></div>
    <div id="panel" class="hidden"></div>
    <div id="hint" class="hidden"></div>
    <div id="banner" class="hidden"></div>
    <div id="wx" class="hidden"></div>
    <div id="ord" class="hidden"></div>
    <div id="toasts"></div>
  </main>

  <aside id="dock">
    <div id="tabs">
      <button class="tab on" data-tab="def" data-i18n="tab.def">DEFENSA</button>
      <button class="tab" data-tab="air" data-i18n="tab.air">AIRE</button>
      <button class="tab" data-tab="rad" data-i18n="tab.rad">RADARES</button>
      <button class="tabx" id="btn-restock" data-i18n-title="restock.title" title="Reabastecer todas las baterías [F]">REABAST.</button>
    </div>
    <div id="cards"></div>
  </aside>
</div>
<div id="coach" class="hidden"></div>
<div id="rpbar" class="hidden"><span data-i18n="rp.on">REPLAY</span><i><b id="rpfill"></b></i><button id="rpskip" data-i18n="rp.skip">SKIP</button></div>
<div id="overlay" class="hidden"></div>
<script src="maps.js"></script>
<script src="maps2.js"></script>
<script src="maps_hist.js"></script>
<script src="i18n.js"></script>
<script src="lang/es.js"></script>
<script src="lang/en.js"></script>
<script src="lang/fr.js"></script>
<script src="lang/de.js"></script>
<script src="lang/pt.js"></script>
<script src="lang/hist.js"></script>
<script src="hist/korea_core.js"></script>
<script src="hist/korea_m1.js"></script>
<script src="hist/korea_m2.js"></script>
<script src="hist/korea_m3.js"></script>
<script src="hist/korea_m4.js"></script>
<script src="hist/korea_units.js"></script>
<script src="config.js"></script>
<script src="game.js"></script>
<script>
if ("serviceWorker" in navigator && /^https?:/.test(location.protocol) && !(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform())) window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });
</script>
</body>
</html>
